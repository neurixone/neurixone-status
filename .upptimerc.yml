# NeurixOne status page (founder, 24 Nov 2026: Upptime, option A). Runs on GitHub, outside NeurixOne's own servers,
# so it stays up when they are down. Only public addresses are listed here, never secrets.
owner: neurixone
repo: neurixone-status

sites:
  - name: Website
    url: https://neurixone.com
  - name: Account and apps
    url: https://account.neurixone.com
  - name: Sign-in
    url: https://auth.neurixone.com/.well-known/openid-configuration
  - name: Neurix Live
    url: https://live.neurixone.com

status-website:
  cname: status.neurixone.com
  logoUrl: https://raw.githubusercontent.com/neurixone/neurixone-status/master/assets/neurixone-mark.svg
  favicon: https://raw.githubusercontent.com/neurixone/neurixone-status/master/assets/neurixone-mark.svg
  name: NeurixOne status
  theme: dark
  introTitle: "Is NeurixOne working?"
  introMessage: Live status of the NeurixOne website, your account and sign-in, and Neurix Live, checked every five minutes from outside our own servers. When something goes wrong, we post what happened and when it is fixed.
  navbar:
    - title: Status
      href: /
    - title: NeurixOne
      href: https://neurixone.com
  # The NeurixOne theme (v1.2): always dark, neutral surfaces.
  customHeadHtml: >-
    <style>:root{--body-background-color:#111;--card-background-color:#181818;--nav-background-color:#111;--body-text-color:#ededed;--card-border-color:#2c2c2c}</style>

# Issues for incidents are opened by the robots and assigned to the founder's account.
assignees:
  - neurixmedia
